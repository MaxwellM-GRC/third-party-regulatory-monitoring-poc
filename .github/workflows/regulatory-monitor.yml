name: Regulatory monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1-5"

permissions:
  contents: read
  issues: write

jobs:
  screen-and-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.main
      - uses: actions/upload-artifact@v4
        with:
          name: regulatory-monitoring-${{ github.run_id }}
          path: output/
      - name: Create or refresh potential-match cases
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const evidence = JSON.parse(fs.readFileSync('output/audit_evidence.json', 'utf8'));
            for (const finding of evidence.potential_matches) {
              const title = `[Potential match] ${finding.case_id}`;
              const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${finding.case_id}"`;
              const existing = await github.rest.search.issuesAndPullRequests({q: query});
              const body = [
                'Potential match for qualified legal/compliance review. This is not a legal conclusion or an assertion of noncompliance.',
                '', `Case: **${finding.case_id}**`, `Rule: **${finding.rule_id}**`,
                `Source record: **${finding.source_system}/${finding.record_id}**`,
                `Signal: **${finding.potential_match_type}**`,
                '', '- [ ] Validate identity and source evidence',
                '- [ ] Record qualified legal/compliance assessment',
                '- [ ] Complete and evidence any human-approved remediation',
                '- [ ] Obtain qualified legal/compliance approval before closure'
              ].join('\n');
              if (existing.data.total_count === 0) {
                await github.rest.issues.create({...context.repo, title, body, labels: ['potential-match', 'human-review-required']});
              } else {
                await github.rest.issues.update({...context.repo, issue_number: existing.data.items[0].number, body});
              }
            }
