control:
  id: RCM-TPRM-001
  name: Third Party Regulatory Monitoring
  category: regulatory_monitoring
  risk_category: regulatory_monitoring
  owner: Compliance Operations
  reviewer_role: Qualified Legal or Compliance Reviewer
  risk: Failure to screen complete third party master data against current, approved regulatory rule sources could leave a potential issue unidentified or prevent timely qualified review.
  objective: Complete third party populations are screened against current rule source snapshots that counsel has approved, and potential matches are investigated, evidenced, approved, and closed by authorized people.
  description: Compliance Operations reconciles AP, CRM, and ERP third party master populations, screens them against approved regulatory rule sources, and routes potential matches for qualified legal or compliance review.
  control_description: Management performs full population reconciliation and screens active AP, CRM, and ERP third party records against current rule sources that counsel has approved. Automation identifies and routes potential matches only; a qualified legal or compliance reviewer determines identity, applicability, response, remediation, risk disposition, and closure.
  activity: Reconcile AP, CRM, and ERP third party master populations; screen active records against counsel approved rule sources; and route potential matches to qualified legal or compliance reviewers for decision and closure.
  population: All active and inactive supplier, customer, and business partner master records extracted for the review date; only active records are screened, while exclusions remain evidenced.
  frequency: Daily in production; on demand in this proof of concept.

review:
  as_of_date: "2026-09-17"
  fuzzy_name_threshold: 0.86
  counsel_approval_required: true

rules:
  RM-01:
    id: RM-01
    severity: high
    assertion: Exact identifiers or exact normalized names may match an entity in an approved regulatory source.
    control_description: Exact identifiers or exact normalized names may match an entity in an approved regulatory source.
    detection_logic: Compare each active record's identifier and normalized legal name to active entries and aliases in the approved entity source.
    source_id: regulatory_entities
    source_provenance: Retained rule source snapshot validated against data/source_manifest.json and a current counsel approval.
    default_response_guidance: Route the potential match to a qualified legal or compliance reviewer, who determines identity, applicability, and any response.
  RM-02:
    id: RM-02
    severity: medium
    assertion: Similar normalized names may match an entity in an approved regulatory source and require human disambiguation.
    control_description: Similar normalized names may match an entity in an approved regulatory source and require human disambiguation.
    detection_logic: Calculate deterministic normalized name similarity for each active record and report scores at or above the configured threshold when no exact match exists.
    source_id: regulatory_entities
    source_provenance: Retained rule source snapshot validated against data/source_manifest.json and a current counsel approval.
    default_response_guidance: Route the potential match to a qualified legal or compliance reviewer for identity disambiguation and response determination.
  RM-03:
    id: RM-03
    severity: medium
    assertion: A third party in an approved review jurisdiction requires qualified human review under the configured policy source.
    control_description: A third party in an approved review jurisdiction requires qualified human review under the configured policy source.
    detection_logic: Compare each active record's country code to effective entries in the approved jurisdiction routing source.
    source_id: review_jurisdictions
    source_provenance: Retained rule source snapshot validated against data/source_manifest.json and a current counsel approval.
    default_response_guidance: Route the record to a qualified legal or compliance reviewer, who determines policy or legal applicability and any response.

case_governance:
  owner: Compliance Operations owns triage and assignment; a qualified legal or compliance reviewer owns the disposition.
  remediation: The qualified reviewer determines whether remediation or another response is required and approves its scope, owner, and evidence.
  lookback: The qualified reviewer determines any lookback period and review procedures based on validated identity, applicability, exposure, and approved policy.
  root_cause: Document root cause when a confirmed process or control breakdown contributed to the issue or delayed its identification.
  closure_evidence: Retain identity and applicability analysis, response evidence when required, reviewer rationale, supporting references, and qualified closure approval.
  sla: No universal remediation SLA is configured; the qualified reviewer assigns a human approved target when a response is required.
  escalation: Escalate cases that exceed an assigned target, present urgent facts, or require leadership attention to the designated legal and compliance roles.
  recurrence: Reopen the case or create a linked case when the potential match recurs, and document whether prior actions or monitoring require revision.
  human_closure: Automation never closes a case; a qualified legal or compliance reviewer must approve and evidence closure.

sources:
  - id: ap_suppliers
    category: master_population
    system: AP
    path: data/ap_suppliers.csv
    primary_key: record_id
    required_columns: [record_id, legal_name, tax_or_registration_id, country_code, address, active, source_updated_at]
  - id: crm_customers
    category: master_population
    system: CRM
    path: data/crm_customers.csv
    primary_key: record_id
    required_columns: [record_id, legal_name, tax_or_registration_id, country_code, address, active, source_updated_at]
  - id: erp_business_partners
    category: master_population
    system: ERP
    path: data/erp_business_partners.csv
    primary_key: record_id
    required_columns: [record_id, legal_name, tax_or_registration_id, country_code, address, active, source_updated_at]
  - id: regulatory_entities
    category: rule_source
    system: Fictional entity list approved by counsel
    path: data/rule_sources/regulatory_entities.csv
    primary_key: source_entry_id
    required_columns: [source_entry_id, entity_name, aliases, identifier, country_code, program, source_reference, effective_date, expiration_date]
  - id: review_jurisdictions
    category: rule_source
    system: Fictional jurisdiction policy approved by counsel
    path: data/rule_sources/review_jurisdictions.csv
    primary_key: jurisdiction_code
    required_columns: [jurisdiction_code, rule_name, source_reference, effective_date, expiration_date]
  - id: counsel_approvals
    category: governance
    system: Compliance policy repository
    path: data/counsel_approvals.csv
    primary_key: approval_id
    required_columns: [approval_id, rule_source_id, approved_by, reviewer_role, approved_at, valid_through, scope, status]
